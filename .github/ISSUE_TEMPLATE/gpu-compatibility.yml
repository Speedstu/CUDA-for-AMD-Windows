name: GPU compatibility report
description: Report a working or failing AMD GPU so the Windows compatibility matrix can grow.
title: "[GPU] "
labels: ["gpu-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing another GPU. **Radeon AI PRO R9700 / gfx1201 with TheRock HIP SDK nightly 7.14.0a20260612 is currently the project target reference.** Successful and failed reports are both useful.

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Exact GPU model.
      placeholder: AMD Radeon RX 7900 XTX
    validations:
      required: true

  - type: input
    id: gfx
    attributes:
      label: gfx target
      description: Run `scripts\gpu-scan.ps1` and copy the detected `gfxXXXX` value.
      placeholder: gfx1100
    validations:
      required: true

  - type: input
    id: hip
    attributes:
      label: HIP / ROCm version
      placeholder: 7.14.0a20260612
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: AMD driver version
      placeholder: 32.x.x.x
    validations:
      required: false

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works - training/inference completed
        - Works - basic CUDA workload only
        - Partial - launches but some operations fail
        - Fails to launch
        - GPU/HIP not detected
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: Workload / application
      description: What did you actually run? Include framework/version if relevant.
      placeholder: LibTorch 2.3.0+cu118, model/training workload, command used...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or first useful error
      description: Paste the relevant console output. Please remove secrets or unrelated personal paths.
      render: shell
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: GPU scanner report
      description: Drag `gpu-report.json` here, or paste the relevant fields from `scripts\gpu-scan.ps1 -AsJson`.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Validation note
      options:
        - label: I understand that Radeon AI PRO R9700 / gfx1201 with TheRock HIP SDK nightly 7.14.0a20260612 is the current project target and this report is compatibility data.
          required: true
