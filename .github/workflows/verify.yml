name: verify

on:
  push:
  pull_request:

jobs:
  static-and-zluda-pin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Get-ChildItem manifests -Filter *.json | ForEach-Object {
            Write-Host "Parsing $($_.Name)"
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: GPU scanner no-GPU smoke test
        shell: pwsh
        run: |
          $json = & ./scripts/gpu-scan.ps1 -AsJson
          $report = $json | ConvertFrom-Json
          if ($report.schema -ne 1) { throw 'Unexpected scanner schema' }
          Write-Host "Scanner schema $($report.schema) OK"

      - name: Verify pinned ZLUDA release asset
        shell: pwsh
        run: |
          $url = 'https://github.com/vosen/ZLUDA/releases/download/v6-preview.69/zluda-windows-87531d3.zip'
          $expected = 'E2959ED17C8DDAE6BF2BF76CF3A7348F577A2548754685D776389DF2220E5D9A'
          Invoke-WebRequest -Uri $url -OutFile zluda.zip
          $actual = (Get-FileHash zluda.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "ZLUDA hash mismatch: $actual" }
          Write-Host "Verified $actual"
